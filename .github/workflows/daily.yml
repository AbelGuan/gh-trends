name: daily-trends

on:
  schedule:
    # 每天 01:10 UTC = 北京时间 09:10（避开整点：Actions 和飞书在整点都容易拥堵）
    - cron: "10 1 * * *"
  workflow_dispatch:        # 也可以在网页上手动点一次来测试
  push:
    paths:
      - ".github/workflows/daily.yml"   # 改了 workflow 自己就立刻验证一次（机器人提交不会碰这个路径，不会循环）

permissions:
  contents: write           # 需要写权限才能把报告提交回仓库

concurrency:
  group: daily-trends
  cancel-in-progress: false

env:
  # 让 python 的 datetime.now() 用北京时间（否则 runner 按 UTC 生成日期，
  # 手动在晚上触发时会写成“昨天”的文件名）
  TZ: Asia/Shanghai

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 抓取 GitHub Trending
        run: |
          python gh_trends.py --since daily --no-color
          python gh_trends.py --since weekly --no-color --limit 15

      - name: 推送（飞书 / 微信 / 浏览器）
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}          # 自建 ntfy 才需要，否则留空
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        # NOTIFY_CHANNELS 是仓库 Variables（不是 Secret）：留空=发所有已配置渠道，
        # 填 feishu,ntfy,serverchan,pushplus 里的几个就能只发指定渠道
        run: python notify.py --top 10 --channels "${{ vars.NOTIFY_CHANNELS }}"

      - name: 生成 Atom feed（给 Obsidian / RSS 阅读器订阅）
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python make_feed.py --top 10 --limit 30

      - name: 提交报告（供 GitHub Pages / Obsidian 拉取）
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 这个仓库可能同时在被手动推送（改代码/改配置），所以推送被拒很正常。
          # 策略：第 1 次直接用已生成的文件；失败就 fetch + reset 到最新远端，
          # 重新生成一遍再试。因为报告/feed 都是确定性的，重新生成不会丢东西。
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "第 $attempt 次尝试：拉取最新远端并重新生成"
              git fetch -q origin main
              git reset --hard -q origin/main
              python gh_trends.py --since daily  --no-color > /dev/null
              python gh_trends.py --since weekly --no-color --limit 15 > /dev/null
              python make_feed.py --top 10 --limit 30 > /dev/null
            fi

            git add -A
            if git diff --cached --quiet; then
              echo "内容没有变化，跳过提交"
              exit 0
            fi
            git commit -q -m "chore: GitHub Trending $(date +%F)"

            if git push -q origin main; then
              echo "✅ 已提交（第 $attempt 次尝试成功）"
              exit 0
            fi
            echo "⚠️  推送被拒（可能同时有别的提交），10 秒后重试"
            sleep 10
          done
          echo "❌ 连续 3 次推送失败，请手动看一下仓库状态"
          exit 1

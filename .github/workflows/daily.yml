name: daily-trends

on:
  schedule:
    # 每天 01:10 UTC = 北京时间 09:10（避开整点：Actions 和飞书在整点都容易拥堵）
    - cron: "10 1 * * *"
  workflow_dispatch:        # 也可以在网页上手动点一次来测试

permissions:
  contents: write           # 需要写权限才能把报告提交回仓库

concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 抓取 GitHub Trending
        run: |
          python gh_trends.py --since daily --no-color
          python gh_trends.py --since weekly --no-color --limit 15

      - name: 推送到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python notify_feishu.py --top 10

      - name: 提交报告（供 GitHub Pages / Obsidian 拉取）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "chore: GitHub Trending $(date -u +%F)"
            git push
          fi
